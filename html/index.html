<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps & System Automation Portfolio</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 600px;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; line-height: 1.6; }
        .status {
            display: inline-block;
            background: #10b981;
            color: #022c22;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Nginx Container Successfully Deployed!</h1>
        <p>This web application is running inside an isolated Docker environment with custom Nginx routing and port forwarding>
        <div class="status">● Container Status: Active</div>
        <img src="photo.png" alt="Proof of Work" style="max-width: 100%; border-radius: 8px;">
    </div>
</body>
</html>
